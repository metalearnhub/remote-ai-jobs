<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Private · Remote AI Work</title><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#4B2EE8">
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<style>
:root{--ink:#13161B;--ink2:#555C67;--line:#DFE3E8;--paper:#F4F5F7;--acc:#4B2EE8;--bad:#C13A2F}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
.top{position:fixed;top:0;left:0;right:0;height:44px;padding:0 10px;padding-top:env(safe-area-inset-top);display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:2;font-size:.85rem}
.top a{color:var(--ink2);text-decoration:none;font-weight:600;padding:8px}
.seg{flex:1;display:flex;gap:4px;min-width:0}.seg a{padding:6px 12px;border-radius:99px;color:var(--ink2)}.seg a.on{background:#ECE8FE;color:var(--acc)}.top b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.9rem}
.lock{font-size:.75rem;color:var(--ink2);border:1px solid var(--line);border-radius:99px;padding:2px 8px;white-space:nowrap}
iframe{position:fixed;top:calc(44px + env(safe-area-inset-top));left:0;right:0;bottom:0;width:100%;height:calc(100% - 44px - env(safe-area-inset-top));border:0;background:#fff}
.box{max-width:380px;margin:18vh auto 0;padding:24px 20px;background:#fff;border:1px solid var(--line);border-radius:16px;display:grid;gap:12px}
.box h1{font-size:1.2rem;margin:0}.box p{margin:0;color:var(--ink2);font-size:.92rem}
input{font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;width:100%}
button{font:inherit;font-weight:700;padding:12px 16px;border:0;border-radius:12px;background:var(--acc);color:#fff;cursor:pointer;min-height:46px}
button[disabled]{opacity:.6}.cg{display:grid;gap:10px}.cg[hidden]{display:none}.err{color:var(--bad);font-size:.9rem;min-height:1.2em}
</style></head>
<body>
<div id="app"><p style="text-align:center;margin-top:30vh;color:#555C67">Loading…</p></div>
<script>
(function () {
  var FN = 'https://qbubwemdvwflxvxwesrl.supabase.co/functions/v1/rj';
  var RPC = 'https://qbubwemdvwflxvxwesrl.supabase.co/rest/v1/rpc/';
  var KEY = 'sb_publishable_zoqPKy4LSecdPN8d0M0mug_Rrejb0XR';
  var EMAIL = 'dijaedadula@gmail.com';
  var slug = (location.pathname.split('/')[2] || 'micro1-funnel').toLowerCase();
  var PAGES = [['micro1-funnel', 'Landing page'], ['zara-interview', 'Guide']];
  var app = document.getElementById('app');
  var tok = ''; try { tok = localStorage.getItem('rj_admin') || ''; } catch (e) {}
  var guest = ''; try { guest = localStorage.getItem('rj_vault_guest') || ''; } catch (e) {}
  function rpc(fn, body) { return fetch(RPC + fn, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: KEY, Authorization: 'Bearer ' + KEY }, body: JSON.stringify(body) }).then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.message || 'Something went wrong'); return d; }); }); }
  function note(t, m) { app.innerHTML = '<div class="box"><h1>' + esc(t) + '</h1><p>' + esc(m) + '</p></div>'; }
  function esc(s) { return String(s || '').replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function api(b) { return fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) }).then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || 'Something went wrong'); return d; }); }); }

  function login(msg) {
    app.innerHTML = '<form class="box" id="f"><h1>Private page</h1><p>Only you can open this. A 6-digit code goes to ' + esc(EMAIL) + '.</p>' +
      '<button type="submit" id="send">Email me a code</button><div id="c" hidden class="cg"><input id="code" inputmode="numeric" maxlength="6" placeholder="6-digit code" autocomplete="one-time-code" aria-label="6-digit code"><button type="button" id="go">Open</button></div><div class="err" id="e">' + esc(msg || '') + '</div></form>';
    var e = document.getElementById('e');
    document.getElementById('f').onsubmit = function (ev) {
      ev.preventDefault(); var b = document.getElementById('send'); b.disabled = true; e.textContent = '';
      api({ action: 'code', email: EMAIL }).then(function () { document.getElementById('c').hidden = false; b.textContent = 'Code sent ✓'; document.getElementById('code').focus(); })
        .catch(function (x) { b.disabled = false; e.textContent = x.message; });
    };
    document.getElementById('go').onclick = function () {
      e.textContent = '';
      api({ action: 'verify', email: EMAIL, code: document.getElementById('code').value }).then(function (d) { tok = d.token; try { localStorage.setItem('rj_admin', tok); } catch (x) {} load(); })
        .catch(function (x) { e.textContent = x.message; });
    };
  }

  function load() {
    if (!tok && !guest) return login();
    rpc('rj_vault_open', { p_token: tok || null, p_slug: slug, p_guest: guest || null })
      .then(function (d) {
        var row = d && d[0];
        if (!row) return note('Not found', 'No private page called “' + slug + '”.');
        var owner = row.viewer === 'owner';
        var L = 'color:#fff;text-decoration:none;padding:10px 10px;display:inline-block;background:none;border:0;font:inherit;cursor:pointer';
        var pill = '<div id="vpill" style="position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:2147483646;background:rgba(19,22,27,.85);font:600 13px/1 system-ui,sans-serif;border-radius:99px;box-shadow:0 4px 14px rgba(0,0,0,.25);padding:0 4px">' +
          (owner ? '<a href="/admin" style="' + L + '" title="Private: only you">🔒</a>' : '') +
          PAGES.map(function (p) { return '<a href="/vault/' + p[0] + '" style="' + L + (p[0] === slug ? ';color:#9EE6C8' : '') + '">' + p[1] + '</a>'; }).join('') +
          (owner ? '<button type="button" id="vshare" style="' + L + ';color:#FFD27A">Share</button>' : '') + '</div>';
        var html = row.html.replace('<base target="_blank">', '').replace(/<\/body>/i, pill + (owner ? SHARE_UI : '') + '</body>');
        document.open(); document.write(html); document.close();
        try { document.title = row.title + (owner ? ' · Private' : ''); } catch (e) {}
      })
      .catch(function () {
        if (guest && !tok) { try { localStorage.removeItem('rj_vault_guest'); } catch (e) {} return note('Access ended', 'This private link has expired or was turned off. Ask Dijae for a new one.'); }
        try { localStorage.removeItem('rj_admin'); } catch (e) {} tok = ''; login('Your sign-in expired. Get a new code.');
      });
  }

  // Owner-only sheet: make links for friends, choose how many devices each can open on, extend or turn off later.
  // Runs inside the rendered page, so it is injected as source.
  function ownerShare(RPC, K) {
    var T = localStorage.getItem('rj_admin');
    var css = '#vsh{position:fixed;inset:0;z-index:2147483647;background:rgba(0,0,0,.45);font:15px/1.45 system-ui,-apple-system,sans-serif;color:#13161B}#vsh[hidden]{display:none}' +
      '#vsh .sh{position:absolute;left:0;right:0;bottom:0;max-height:90dvh;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}' +
      '#vsh input,#vsh select{font:inherit;font-size:16px;padding:11px 12px;border:1.5px solid #DFE3E8;border-radius:12px;background:#fff;color:#13161B;min-width:0}' +
      '#vsh button{font:inherit;font-weight:700;border-radius:10px;cursor:pointer}#vsh .pri{padding:12px 16px;border:0;background:#4B2EE8;color:#fff}#vsh .gh{padding:8px 10px;border:1.5px solid #DFE3E8;background:#fff;color:#13161B;font-size:14px}' +
      '#vsh .row{display:flex;gap:8px;align-items:center}#vsh .muted{color:#555C67;font-size:13px}#vsh .item{border:1px solid #DFE3E8;border-radius:12px;padding:10px 12px;display:grid;gap:8px}' +
      '#vsh .step{display:inline-flex;align-items:center;border:1.5px solid #DFE3E8;border-radius:10px;overflow:hidden}#vsh .step button{border:0;border-radius:0;background:#F4F5F7;width:36px;height:36px;font-size:18px;padding:0}#vsh .step b{min-width:34px;text-align:center}';
    var box = document.createElement('div'); box.id = 'vsh'; box.hidden = true;
    box.innerHTML = '<style>' + css + '</style><div class="sh">' +
      '<div class="row" style="justify-content:space-between;margin-bottom:6px"><b style="font-size:17px">Share with a friend</b><button type="button" class="gh" id="vx" aria-label="Close">✕</button></div>' +
      '<p class="muted" style="margin:0 0 12px">Each device that opens the link uses one “open”. When they’re used up, anyone else sees “already used”. You can add more opens or days any time.</p>' +
      '<div style="display:grid;gap:10px"><input id="vn" placeholder="Friend\'s name (only you see it)">' +
      '<div class="row"><span style="flex:1">Can open on</span><span class="step"><button type="button" data-n="-1" aria-label="Fewer">−</button><b id="vm">1</b><button type="button" data-n="1" aria-label="More">+</button></span><span>device(s)</span></div>' +
      '<div class="row"><select id="vd" style="flex:1"><option value="1">Works for 1 day</option><option value="7" selected>Works for 7 days</option><option value="30">Works for 30 days</option><option value="365">Works for 1 year</option></select><button type="button" class="pri" id="vc">Create link</button></div>' +
      '<div id="vout" hidden style="background:#ECE8FE;border-radius:12px;padding:12px;display:grid;gap:8px"><code id="vlink" style="word-break:break-all;font-size:13px"></code><div class="row"><button type="button" class="pri" id="vcopy" style="flex:1;padding:10px">Copy link</button><button type="button" class="gh" id="vsend" style="flex:1;padding:10px;color:#4B2EE8;border-color:#4B2EE8">Send…</button></div></div>' +
      '<p id="verr" style="color:#C13A2F;margin:0;font-size:14px"></p></div>' +
      '<b style="display:block;margin:16px 0 6px;font-size:14px">Your links</b><div id="vlist" style="display:grid;gap:8px"><span class="muted">Loading…</span></div></div>';
    document.body.appendChild(box);
    function $(i) { return document.getElementById(i); }
    function e(x) { return String(x == null ? '' : x).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
    function d(x) { return new Date(x).toLocaleDateString('en-PH', { month: 'short', day: 'numeric' }); }
    function rpc(b) { return fetch(RPC + 'rj_vault_manage', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: K, Authorization: 'Bearer ' + K }, body: JSON.stringify(Object.assign({ p_token: T }, b)) }).then(function (r) { return r.json().then(function (x) { if (!r.ok) throw new Error(x.message || 'Error'); return x; }); }); }
    var max = 1, link = '', ITEMS = [];
    function list() {
      rpc({ p_op: 'list' }).then(function (xs) {
        ITEMS = xs;
        $('vlist').innerHTML = xs.length ? xs.map(function (x) {
          var exp = new Date(x.expires_at).getTime() < Date.now(), off = x.revoked || exp, full = x.claims >= x.max_claims;
          var st = x.revoked ? 'Turned off' : exp ? 'Expired ' + d(x.expires_at) : (x.claims ? 'Opened on ' + x.claims + ' of ' + x.max_claims + ' device' + (x.max_claims == 1 ? '' : 's') + ' · ' + x.opens + ' view' + (x.opens == 1 ? '' : 's') : 'Not opened yet · ' + x.max_claims + ' open' + (x.max_claims == 1 ? '' : 's') + ' allowed') + ' · until ' + d(x.expires_at);
          return '<div class="item"><div><b>' + e(x.label) + '</b>' + (full && !off ? ' <span class="muted">(used up)</span>' : '') + '<div class="muted">' + st + '</div></div>' +
            '<div class="row" style="flex-wrap:wrap">' +
            (x.revoked ? '<button class="gh" data-op="restore" data-id="' + x.id + '">Turn back on</button>' :
              '<span class="muted">Opens</span><span class="step"><button type="button" data-op="max" data-d="-1" data-id="' + x.id + '"' + (x.max_claims <= Math.max(1, x.claims) ? ' disabled style="opacity:.4"' : '') + ' aria-label="Fewer opens">−</button><b>' + x.max_claims + '</b><button type="button" data-op="max" data-d="1" data-id="' + x.id + '" aria-label="More opens">+</button></span>' +
              '<button class="gh" data-op="extend" data-id="' + x.id + '">+7 days</button>' +
              '<button class="gh" data-op="revoke" data-id="' + x.id + '" style="color:#C13A2F;margin-left:auto">Turn off</button>') +
            '</div></div>';
        }).join('') : '<span class="muted">No links yet.</span>';
      }).catch(function (x) { $('vlist').textContent = x.message; });
    }
    $('vshare').onclick = function () { box.hidden = false; list(); };
    $('vx').onclick = function () { box.hidden = true; };
    box.onclick = function (ev) { if (ev.target === box) box.hidden = true; };
    box.querySelectorAll('[data-n]').forEach(function (b) { b.onclick = function () { max = Math.max(1, Math.min(100, max + (+b.dataset.n))); $('vm').textContent = max; }; });
    $('vc').onclick = function () {
      var b = this; b.disabled = true; $('verr').textContent = '';
      rpc({ p_op: 'create', p_label: $('vn').value, p_days: +$('vd').value, p_max: max }).then(function (r) {
        link = location.origin + '/vault/micro1-funnel#k=' + r.key; $('vlink').textContent = link; $('vout').hidden = false; $('vn').value = ''; list();
      }).catch(function (x) { $('verr').textContent = x.message; }).then(function () { b.disabled = false; });
    };
    $('vcopy').onclick = function () { var b = this; (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject()).then(function () { b.textContent = 'Copied ✓'; setTimeout(function () { b.textContent = 'Copy link'; }, 1500); }, function () { prompt('Copy this link:', link); }); };
    $('vsend').onclick = function () { var t = "Here's my micro1 interview guide:"; if (navigator.share) navigator.share({ text: t, url: link }).catch(function () {}); else location.href = 'https://wa.me/?text=' + encodeURIComponent(t + '\n' + link); };
    $('vlist').onclick = function (ev) {
      var b = ev.target.closest('[data-op]'); if (!b || b.disabled) return;
      var id = +b.dataset.id, x = ITEMS.filter(function (i) { return i.id === id; })[0], op = b.dataset.op, body = { p_id: id };
      if (op === 'max') { body.p_op = 'set_max'; body.p_max = x.max_claims + (+b.dataset.d); }
      else if (op === 'extend') { body.p_op = 'extend'; body.p_days = 7; }
      else body.p_op = op;
      b.disabled = true; rpc(body).then(list).catch(function (er) { alert(er.message); list(); });
    };
  }
  var SHARE_UI = '<script>(' + ownerShare.toString() + ')(' + JSON.stringify(RPC) + ',' + JSON.stringify(KEY) + ');<\/script>';

  // Opened from the CRM: trade the one-time pass for a session, no emailed code needed.
  var sso = /[#&]sso=([0-9a-f]{64})/.exec(location.hash);
  var key = /[#&]k=([0-9a-f]{48})/.exec(location.hash);
  if (key) {
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
    if (tok || guest) load(); // you, or the friend reopening their own link
    else rpc('rj_vault_claim', { p_key: key[1] })
      .then(function (r) { guest = r.guest; try { localStorage.setItem('rj_vault_guest', guest); } catch (e) {} load(); })
      .catch(function (x) { note('Link already used', x.message); });
  } else if (sso) {
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
    if (tok) load();
    else fetch('https://qbubwemdvwflxvxwesrl.supabase.co/functions/v1/sso', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'redeem', app: 'jobs', pass: sso[1] }) })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (x) { if (!x.ok || !x.d.token) throw new Error(); tok = x.d.token; try { localStorage.setItem('rj_admin', tok); } catch (e) {} load(); })
      .catch(function () { login('Couldn’t sign you in from the CRM. Use an emailed code.'); });
  } else load();
})();
</script>
</body></html>
